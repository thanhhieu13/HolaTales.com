name: linguacafe

networks:
    linguacafe:
        driver: bridge

services:
    webserver:
        build:
            context: .
            dockerfile: docker/PhpDockerfile
        image: holatales-webserver:${VERSION:-local}
        env_file: .env
        container_name: linguacafe-webserver
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - ./storage:/var/www/html/storage
            - ./docker/supervisor-horizon.conf:/etc/supervisor/conf.d/horizon.conf
            - ./docker/supervisor-websockets.conf:/etc/supervisor/conf.d/websockets.conf
        environment:
            DB_DATABASE: ${DB_DATABASE:-linguacafe}
            DB_USERNAME: ${DB_USERNAME:-linguacafe}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            DB_HOST: ${DB_HOST:-linguacafe-database}
            DB_PORT: ${DB_PORT:-3306}
            APP_KEY: ${APP_KEY:?Set APP_KEY}
            APP_ENV: production
            APP_DEBUG: "false"
            PYTHON_CONTAINER_NAME: http://linguacafe-python-service
            REDIS_HOST: linguacafe-redis
            BACKUP_INTERVAL: "59 23 * * *"
            MAX_SAVED_BACKUPS: 14
        ports:
            - "127.0.0.1:6001:6001"
            - "127.0.0.1:${PORT:-9191}:80"
        networks:
            - linguacafe
        extra_hosts:
            - "host.docker.internal:host-gateway"
    mysql:
        image: mysql:8.0
        container_name: linguacafe-database
        restart: unless-stopped
        tty: true
        healthcheck:
            test: ["CMD-SHELL", 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
            interval: 10s
            timeout: 5s
            retries: 10
        volumes:
            - holatales-mysql:/var/lib/mysql
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-linguacafe}
            MYSQL_USER: ${DB_USERNAME:-linguacafe}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
            SERVICE_NAME: linguacafe

        networks:
            - linguacafe
    redis:
        image: redis:7.2-alpine
        container_name: linguacafe-redis
        restart: unless-stopped
        volumes: 
            - ./cache:/data
        environment:
            REDIS_PORT: 6379
            REDIS_DATABASES: 16
        networks:
            - linguacafe
    python:
        container_name: linguacafe-python-service
        command: "python3 /app/tokenizer.py"
        restart: unless-stopped
        tty: true
        build:
            context: .
            dockerfile: docker/PythonDockerfile
        image: holatales-python-service:${VERSION:-local}
        environment:
            TOKENIZER_HOST: "0.0.0.0"
            TOKENIZER_IMPORT_ROOT: "/var/www/html/storage/app/temp"
            PYTHONPATH: "/var/www/html/storage/app/model"
        volumes:
            - ./storage:/var/www/html/storage
        networks:
            - linguacafe
        platform: ${PLATFORM:-}
volumes:
    holatales-mysql:
